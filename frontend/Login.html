<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 —— 团青课堂</title>
  <!-- 只引入共用样式让登录页和后面几页风格一致，登录逻辑保持原样 -->
  <link rel="stylesheet" href="Common.css">
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <div class="brand">
        <span class="emblem">团</span>
        <span>团青课堂</span>
      </div>
      <p class="login-sub">答题系统</p>

      <div class="field">
        <label for="username">用户名</label>
        <input id="username" placeholder="请输入用户名">
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" placeholder="请输入密码" type="password">
      </div>

      <button class="btn btn-primary btn-block" onclick="login()">登录</button>
      <p id="result" class="login-error"></p>

      <p class="login-tip">
        测试账号：<br>
        学生 <code>student01</code> / <code>123456</code><br>
        管理员 <code>admin</code> / <code>admin123</code>
      </p>
    </div>
  </div>

  <script>
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('http://127.0.0.1:8000/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password})
      });

      const data = await res.json();//拿取后端响应的解析后对象
      if (data.code === 0){
        localStorage.setItem('token', data.data.token);
        localStorage.setItem('user', JSON.stringify({
          id: data.data.id,
          username: data.data.username,
          role: data.data.role,
        }));
        window.location.href = "Home.html"; //中转到home.html
      }else{
        document.getElementById('result').innerText = data.message;
      }
    }
  </script>
</body>
</html>
