<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学生端 —— 团青课堂</title>
  <link rel="stylesheet" href="Common.css">
  <script src="Common.js"></script>
  <script>
    // 在 head 里就把关。未登录会被送回登录页；管理员误入这里会被送回管理员端。
    requireLogin('student');
  </script>
</head>
<body class="role-student">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="emblem">团</span>
        <span>团青课堂</span>
        <span class="role-tag" data-role-label>学生</span>
      </div>
      <div class="user-area">
        <span>欢迎，<strong data-user-name>同学</strong></span>
        <button class="btn" onclick="logout()">退出登录</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>欢迎回来，<span data-user-name>同学</span></h1>
      <p>今天也来温习一遍团的知识吧。</p>
    </div>

    <section class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">题库总数</div>
        <div class="stat-value"><span id="stat-question-total">—</span><small> 题</small></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">已答次数</div>
        <div class="stat-value"><span id="stat-exam-count">—</span><small> 次</small></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">平均分</div>
        <div class="stat-value"><span id="stat-avg-score">—</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">正确率</div>
        <div class="stat-value"><span id="stat-accuracy">—</span><small>%</small></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>答题</h2>
          <p class="panel-desc">每次随机抽取最多 10 道单选题，交卷后立即出分，不限时间。</p>
        </div>
        <button class="btn btn-primary" id="start-btn">开始答题</button>
      </div>
      <div class="panel-body">
        <!-- 未开始时显示 -->
        <div class="placeholder" id="quiz-placeholder">
          <strong>准备好了就开始</strong>
          <p id="quiz-placeholder-msg">点右上角「开始答题」，随机抽一套题。</p>
        </div>

        <!-- 答题中显示 -->
        <div class="hidden" id="quiz-area">
          <p class="quiz-progress" id="quiz-progress">已作答 0 / 0 道</p>
          <div id="question-list"></div>
          <div class="form-actions">
            <button class="btn btn-primary" id="submit-btn">交卷</button>
          </div>
        </div>

        <!-- 交卷后显示 -->
        <div class="hidden" id="result-area">
          <div class="result-summary" id="result-summary"></div>
          <div class="result-details" id="result-details"></div>
          <div class="form-actions">
            <button class="btn btn-primary" id="restart-btn">重新答题</button>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>历史成绩</h2>
          <p class="panel-desc">你每次交卷的成绩，最新的排在最前。</p>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>答题时间</th>
              <th>题量</th>
              <th>得分</th>
              <th>正确率</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody id="history-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="Student.js"></script>
</body>
</html>
