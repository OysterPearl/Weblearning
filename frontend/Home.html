<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正在进入 —— 团青课堂</title>
  <link rel="stylesheet" href="Common.css">
</head>
<body>
  <!-- 纯路由页：登录成功后 Login.html 依旧跳到这里，再由这里按角色分发到对应端。 -->
  <div class="center-screen">
    <div class="loading-card">
      <div class="spinner" id="spinner"></div>
      <p id="tip">正在进入…</p>
      <p id="fallback" class="hidden">
        <a class="btn btn-primary" href="Login.html">返回登录</a>
      </p>
    </div>
  </div>

  <script src="Common.js"></script>
  <script>
    const user = getUser();

    if (!user) {
      window.location.replace('Login.html');
    } else if (ROLE_HOME[user.role]) {
      window.location.replace(ROLE_HOME[user.role]);
    } else {
      // 角色既不是 student 也不是 admin：停在这里给个出口，
      // 否则任何跳转都会绕回来，用户会卡在闪烁的页面上。
      document.getElementById('spinner').classList.add('hidden');
      document.getElementById('tip').textContent = '无法识别的角色：' + user.role;
      document.getElementById('fallback').classList.remove('hidden');
    }
  </script>
</body>
</html>
